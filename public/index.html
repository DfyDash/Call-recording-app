<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CallTrove</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div id="session-bar" class="session-bar"></div>
      <h1>CallTrove</h1>
      <select id="view-as" class="view-as" hidden></select>
      <input id="search" type="search" placeholder="Search contacts by name or phone..." />
      <ul id="contact-list" class="contact-list"></ul>
    </aside>
    <main class="content">
      <div class="filter-bar">
        <div class="filter-contact">
          <span id="contact-filter-label">All contacts</span>
          <button id="clear-contact-btn" class="clear-contact-btn" hidden>&times; Clear</button>
        </div>
        <div class="filter-dates">
          <button type="button" class="preset-btn" data-preset="today">Today</button>
          <button type="button" class="preset-btn" data-preset="week">This week</button>
          <button type="button" class="preset-btn" data-preset="month">This month</button>
          <button type="button" class="preset-btn" data-preset="year">This year</button>
          <label>From <input type="date" id="date-from" /></label>
          <label>To <input type="date" id="date-to" /></label>
        </div>
        <label class="page-size-label">Per page
          <select id="page-size-select">
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </label>
      </div>

      <div id="results-summary" class="results-summary"></div>

      <table>
        <thead>
          <tr>
            <th>Contact</th>
            <th>Date/Time</th>
            <th>Direction</th>
            <th>Duration</th>
            <th>Handled by</th>
            <th>Outcome</th>
            <th>Recording</th>
            <th>Transcript</th>
          </tr>
        </thead>
        <tbody id="call-rows"></tbody>
      </table>

      <div class="pagination">
        <button type="button" id="prev-page-btn">&larr; Prev</button>
        <span id="page-indicator"></span>
        <button type="button" id="next-page-btn">Next &rarr;</button>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
