<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manage Users — CallTrove</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="admin-page">
    <div id="session-bar" class="session-bar"></div>
    <h1>Manage users</h1>
    <p><a href="/">&larr; Back to dashboard</a></p>

    <div id="settings-section" class="settings-section" hidden>
      <h2>Transcription settings</h2>
      <label class="toggle-row">
        <input type="checkbox" id="auto-transcribe-toggle" />
        Automatically transcribe new calls going forward
      </label>
      <p class="settings-note">
        Only affects calls picked up from now on -- turning this on never
        transcribes existing recordings. Anyone can still transcribe an
        individual past call on demand from the dashboard.
      </p>
    </div>

    <table>
      <thead>
        <tr>
          <th>Username</th>
          <th>Role</th>
          <th>GHL user name</th>
          <th>GHL user ID</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="user-rows"></tbody>
    </table>

    <h2>Add user</h2>
    <form id="add-user-form" class="admin-form">
      <label>Username <input type="text" name="username" required /></label>
      <label>Password <input type="password" name="password" required /></label>
      <label>Role
        <select name="role">
          <option value="user">user</option>
          <option value="admin">admin</option>
        </select>
      </label>
      <label>GHL user
        <select name="ghlUser" id="ghl-user-select">
          <option value="">(none)</option>
        </select>
      </label>
      <button type="submit">Add user</button>
      <span id="add-user-error" class="login-error" hidden></span>
    </form>
  </div>
  <script src="admin.js"></script>
</body>
</html>
