<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Call Recording Vault — Log in</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-page">
    <form class="login-card" method="POST" action="/auth/login">
      <h1>Call Recording Vault</h1>
      <div id="login-error" class="login-error" hidden>Incorrect username or password.</div>
      <label>
        Username
        <input type="text" name="username" autocomplete="username" required autofocus />
      </label>
      <label>
        Password
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <button type="submit">Log in</button>
      <p class="forgot-password">Forgot your password? Ask your admin to reset it from Manage Users.</p>
    </form>
  </div>
  <script>
    if (new URLSearchParams(location.search).get("error")) {
      document.getElementById("login-error").hidden = false;
    }
  </script>
</body>
</html>
