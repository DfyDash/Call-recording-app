<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Access Log — CallTrove</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="admin-page">
    <div id="session-bar" class="session-bar"></div>
    <h1>Access log</h1>
    <p><a href="/">&larr; Back to dashboard</a> · <a href="/admin.html">Manage users</a></p>
    <p class="settings-note">
      Who accessed which call's recording or transcript, when, from where,
      and whether it was allowed. Includes denied attempts. Kept
      append-only for at least 6 years.
    </p>

    <table>
      <thead>
        <tr>
          <th>When</th>
          <th>User</th>
          <th>Action</th>
          <th>Call</th>
          <th>Result</th>
          <th>IP address</th>
        </tr>
      </thead>
      <tbody id="access-rows"></tbody>
    </table>
    <div class="pagination">
      <button type="button" id="access-prev-btn">&larr; Prev</button>
      <span id="access-page-indicator"></span>
      <button type="button" id="access-next-btn">Next &rarr;</button>
    </div>
  </div>
  <script src="phi-access-log.js"></script>
</body>
</html>
